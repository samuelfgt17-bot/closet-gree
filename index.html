<title>Closet Gree</title>

<style>
/* Layout: one narrow centered column. Logo on top, four hairline link rows below, small affiliate note at the end. */
:root {
  --bg: #fafafa;          /* same as the logo's own background, so the logo sits flush */
  --ink: #1c1c1e;
  --muted: #6b6b70;
  --line: #d4d4d8;
  --panel: #ffffff;
  --hover: #1c1c1e;
  --hover-ink: #fafafa;
  --logo-filter: none;
  --font-display: "Cormorant Garamond", "Times New Roman", serif;
  --font-label: "Barlow Condensed", "Arial Narrow", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #050505; --ink: #f2f2f2; --muted: #9a9a9f; --line: #2e2e32; --panel: #0c0c0d;
    --hover: #f2f2f2; --hover-ink: #050505; --logo-filter: invert(1); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #050505; --ink: #f2f2f2; --muted: #9a9a9f; --line: #2e2e32; --panel: #0c0c0d;
  --hover: #f2f2f2; --hover-ink: #050505; --logo-filter: invert(1); color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-label);
  padding-block: 40px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}
main { width: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

.brand { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.brand img { width: 100%; max-width: 380px; height: auto; display: block; filter: var(--logo-filter); }
.tagline {
  margin: 0; font-size: 15px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--muted); text-align: center; text-wrap: balance;
}

.links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.link {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px;
  padding: 18px 20px; min-height: 76px;
  background: var(--panel); color: var(--ink); text-decoration: none;
  border: 1px solid var(--line);
  transition: background-color .18s ease, color .18s ease, border-color .18s ease;
}
.link .text { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.link .kicker { font-size: 13px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
.link .title { font-family: var(--font-display); font-size: 26px; font-weight: 600; line-height: 1.1; }
.link .arrow { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.5; flex: none; }
.link:hover, .link:focus-visible { background: var(--hover); color: var(--hover-ink); border-color: var(--hover); }
.link:hover .kicker, .link:focus-visible .kicker { color: inherit; opacity: .7; }
.link:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.note { margin: 0; text-align: center; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { .link { transition: none; } }
@media (max-width: 400px) { .link .title { font-size: 23px; } }
</style>
</head>
